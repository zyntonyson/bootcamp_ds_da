<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webinar semanal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 id="main-title"></h1>
        <h2 id="subtitle"></h2>
        <div id="countdown-timer">00:00</div>
        <p class="welcome-message">Toma un respiro, estírate y prepárate para una sesión increíble. ¡Empezamos pronto!</p>
        
        <div class="music-widget">
            <iframe 
                width="100%" 
                height="300" 
                scrolling="no" 
                frameborder="no" 
                allow="autoplay" 
                src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/chillhopdotcom/sets/lofihiphop&color=%231c232e&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=true">
            </iframe>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
